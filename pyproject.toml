[project]
name = "ai-assistant"
version = "0.1.0"
description = "AI Assistant — LangGraph conversational agent and FastAPI service."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aioboto3>=15.0.0,<16",
    "botocore>=1.38.0",
    "ddtrace>=3.19.0",
    "fastapi>=0.117.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-ulid>=3.1.0",
    "redis>=6.0.0",
    "sentry-sdk>=2.51.0",
    "uvicorn>=0.36.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
addopts = "-vv -p no:ddtrace --cov=ai_assistant --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: real internal AI gateway (VPN + AI_GATEWAY_API_KEY required)",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
