services:
  ai-assistant-base:
    image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/ai-assistant
    build:
      context: .
      args:
        BUILD_ENV: DEV
    environment:
      APP_NAME: ai-assistant
      APP_VERSION: local
      AWS_ACCESS_KEY_ID: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: test
      CONCORDE_BASE_URL: http://concorde
      CONCORDE_AI_SEARCH_BASE_URL: http://content-search
      DATADOG_ENABLED: "false"
      DYNAMODB_CONVERSATIONS_TABLE_NAME: ai_assistant_conversations
      DYNAMODB_ENDPOINT_URL: http://ai-assistant-localstack:4566
      DYNAMODB_MESSAGES_TABLE_NAME: ai_assistant_messages
      DYNAMODB_STATUS_TABLE_NAME: ai-assistant-status
      ENVIRONMENT: dev
      PYTHONPATH: /app
      ROLE: api
      REDIS_DB: 0
      REDIS_HOST: ai-assistant-redis
      REDIS_PORT: 6379
      SENTRY_SAMPLE_RATE: 0
    command: ["sh", "-c", "echo base service only"]

  ai-assistant:
    extends: ai-assistant-base
    depends_on:
      ai-assistant-localstack:
        condition: service_healthy
      ai-assistant-redis:
        condition: service_healthy
    ports:
      - "8000:80"
    command: ["bin/boot.sh"]

  ai-assistant-test:
    extends: ai-assistant-base
    depends_on:
      ai-assistant-localstack:
        condition: service_healthy
      ai-assistant-redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: test
    command: ["uv", "run", "pytest"]

  ai-assistant-localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-assistant-redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
